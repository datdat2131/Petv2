# type: ACTIVE | PASSIVE
# effect ACTIVE: DAMAGE_AOE, DAMAGE_SINGLE, CHAIN, HEAL, SHIELD, BUFF
# effect PASSIVE: HP_PCT, ATK_PCT, DEF_PCT, SPEED_PCT, CRIT, LIFESTEAL, REGEN, REDUCTION
# Giá trị ở cấp L = power + per-level*(L-1). unlock-level: cấp pet mở khóa (tự có cấp 1). cost: điểm kỹ năng để nâng 1 cấp.
# extra: DAMAGE_AOE/SINGLE=giây hiệu ứng (cháy/chậm) hoặc tỉ lệ hút máu; SHIELD/BUFF=thời gian (giây).
